# So PostgreSQL. O mesmo motor da plataforma interna.
# Os scripts de sql/ correm na primeira criacao do volume (schema -> seed).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5434:5432"   # 5432/5433 ja usados pelas aulas 02 e 03
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
