# Metadata SEMANTICA: o que os dados SIGNIFICAM.
# (A metadata TECNICA - colunas e tipos - vem do catalogo do PostgreSQL.)
#
# FONTE UNICA DE VERDADE para metricas. Daqui saem:
#   - a tool get_metric_definition        (formula exata para o SQL)
#   - os Documents de metricas no pgvector (rag/metric_documents.py)
# Ratios sao SEMPRE "ratio of sums": SUM(a) / SUM(b), nunca a media de ratios.

dataset: analytics.campaign_performance_daily

description: >
  Daily advertising performance aggregated by date, provider and campaign,
  normalized from the Erobella, TrafficJunky and Voluum payloads. Money is EUR.

grain:
  - date
  - provider
  - campaign_id

dimensions:

  date:
    description: Performance date.
    synonyms: [date, data, dia]

  provider:
    description: Where the numbers come from.
    values: [erobella, trafficjunky, voluum]

  campaign_name:
    description: Human-readable campaign name. For Erobella it is the creative label.

  campaign_id:
    description: Provider campaign identifier (text).

  traffic_source:
    description: Erobella partner, TrafficJunky, or the Voluum traffic source name.

  country:
    description: ISO-2 country code. Only Voluum reports it (NULL for the other providers).

metrics:

  spend:
    label: Spend
    description: Total advertising spend in EUR.
    synonyms: [spend, gasto, gastos, gastámos, investimento, custo]
    expression: SUM(cost)
    unit: EUR

  impressions:
    label: Impressions
    description: Total ad impressions.
    synonyms: [impressoes, impressões]
    expression: SUM(impressions)
    unit: count

  visits:
    label: Visits
    description: Tracker visits. Only Voluum reports visits (NULL elsewhere).
    synonyms: [visitas]
    expression: SUM(visits)
    unit: count

  clicks:
    label: Clicks
    description: Total clicks.
    synonyms: [cliques]
    expression: SUM(clicks)
    unit: count

  conversions:
    label: Conversions
    description: Total conversions. Erobella does not report conversions (NULL).
    synonyms: [conversoes, conversões]
    expression: SUM(conversions)
    unit: count

  revenue:
    label: Revenue
    description: Total revenue in EUR. Only Voluum reports revenue (NULL elsewhere).
    synonyms: [receita]
    expression: SUM(revenue)
    unit: EUR

  cpc:
    label: Cost per Click
    description: Spend divided by clicks. Ratio of sums, never an average of daily or per-campaign ratios.
    synonyms: [custo por clique, cost per click]
    expression: >
      SUM(cost) / NULLIF(SUM(clicks), 0)
    unit: EUR
    never:
      - AVG(cost / clicks)
      - AVG(cpc)
      - AVG(ecpc)

  ctr:
    label: Click Through Rate
    description: Clicks as a percentage of impressions. Ratio of sums.
    synonyms: [click through rate, taxa de cliques]
    expression: >
      100.0 * SUM(clicks) / NULLIF(SUM(impressions), 0)
    unit: "%"
    never:
      - AVG(clicks / impressions)
      - AVG(ctr)

  conversion_rate:
    label: Conversion Rate
    description: Conversions as a percentage of clicks. Ratio of sums. Rows without conversions (Erobella) give NULL.
    synonyms: [cr, conversion rate, taxa de conversão]
    expression: >
      100.0 * SUM(conversions) / NULLIF(SUM(clicks), 0)
    unit: "%"
    never:
      - AVG(conversions / clicks)
      - AVG(conversion_rate)
      - AVG(cr)

  cpa:
    label: Cost per Acquisition
    description: Spend divided by conversions.
    synonyms: [custo por aquisição, cost per acquisition]
    expression: >
      SUM(cost) / NULLIF(SUM(conversions), 0)
    unit: EUR

  roas:
    label: Return on Ad Spend
    description: >
      Revenue divided by spend. Only meaningful per provider or campaign, because only
      Voluum reports revenue (NULL for erobella and trafficjunky). Do not compute it over mixed providers.
    synonyms: [return on ad spend]
    expression: >
      SUM(revenue) / NULLIF(SUM(cost), 0)
    unit: ratio

  profit:
    label: Profit
    description: Revenue minus spend, in EUR. NULL for providers without revenue. Compare per provider or campaign.
    synonyms: [lucro]
    expression: >
      SUM(revenue) - SUM(cost)
    unit: EUR

  roi:
    label: Return on Investment
    description: Profit as a percentage of spend. NULL for providers without revenue. Compare per provider or campaign.
    synonyms: [return on investment]
    expression: >
      100.0 * (SUM(revenue) - SUM(cost)) / NULLIF(SUM(cost), 0)
    unit: "%"
