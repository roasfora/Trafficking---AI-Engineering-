# PostgreSQL 16 + pgvector. Porta 5435 para nao colidir com a Aula 06 (5434).
# Os scripts de ./sql correm por ordem, SO na primeira vez (volume vazio).
# Para recriar do zero: docker compose down -v && docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics        # dono dos schemas (so dev local)
      POSTGRES_PASSWORD: analytics
    ports:
      - "5435:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
