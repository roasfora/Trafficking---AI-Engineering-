# Tema da aplicacao.
#
# Fazer isto aqui, e nao com CSS injetado no app.py, e a forma suportada:
# tema um sitio so e o Streamlit aplica-o a tudo — barra lateral, botoes,
# campos de texto, expanders. CSS a mao so escurece o que apanhas, e
# deixa metade da interface com texto escuro sobre fundo escuro.

[theme]
base = "dark"
primaryColor = "#C8F03C"          # lima — a cor de accent do curso
backgroundColor = "#0D0D0D"
secondaryBackgroundColor = "#171717"
textColor = "#F5F5F5"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
